{% extends 'marketing_base.html' %}
{% block content %}
<section class="marketing-auth-shell" aria-labelledby="owner-login-title">
  <div class="marketing-auth-layout marketing-auth-layout-login">
    <div class="marketing-auth-context">
      <p class="section-kicker">企业控制台</p>
      <h1 id="owner-login-title">企业主登录</h1>
      <p>使用注册手机号进入企业工作台，管理套餐、订单、机器人额度和团队成员。</p>
    </div>
    <div class="marketing-auth-panel">
      <h2>手机号登录</h2>
      {# 企业主入口只接受所有者手机号，不能混入企业编码或员工用户名。 #}
      <form method="post" action="/login" class="form-grid auth-form-grid">
        <label class="full-row" for="owner-mobile"><span>手机号</span></label><input class="full-row" id="owner-mobile" name="mobile" type="tel" autocomplete="username" inputmode="tel" value="{{ prefill_mobile or '' }}" required />
        <label class="full-row" for="owner-password"><span>密码</span></label><input class="full-row" id="owner-password" name="password" type="password" autocomplete="current-password" required />
        <div class="full-row auth-form-actions"><button class="btn auth-submit" type="submit">登录</button></div>
      </form>
      <div class="marketing-auth-links"><a href="/register">免费试用 7 天</a><a href="/employee/login">员工登录</a></div>
    </div>
  </div>
</section>
{% endblock %}
