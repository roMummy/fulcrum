{% macro friend_remark(item, can_edit, source, csrf_token) -%}
{% if can_edit and item.remark_action %}
<details class="disclosure">
  <summary aria-label="编辑 {{ item.identity.name }} 的备注" title="编辑好友备注">{{ item.remark or '未设置' }} <span class="i i-edit" aria-hidden="true"></span></summary>
  <form method="post" action="{{ item.remark_action }}" data-action-feedback data-action-label="修改好友备注">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="return_to" value="{{ source }}">
    <input type="hidden" name="expected" value="{{ item.remark or '' }}">
    <label>好友备注<input name="remark" value="{{ item.remark or '' }}" maxlength="255"></label>
    <div class="chip-row">
      <button class="btn btn-small btn-icon" type="submit" title="保存备注" aria-label="保存备注"><span class="i i-check" aria-hidden="true"></span></button>
      {% if item.remark %}<button class="btn btn-small btn-secondary btn-icon" type="submit" name="clear" value="true" title="清空备注" aria-label="清空备注"><span class="i i-x" aria-hidden="true"></span></button>{% endif %}
    </div>
  </form>
</details>
{% else %}{{ item.remark or '-' }}{% endif %}
{%- endmacro %}
