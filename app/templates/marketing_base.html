<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ page_title }}{% if page_title != brand_name %} · {{ brand_name }}{% endif %}</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body class="marketing-body">
  <header class="marketing-header">
    <a class="marketing-brand" href="/" aria-label="曜枢 AI 首页">曜枢 AI</a>
    <nav class="marketing-nav" aria-label="公开站点导航">
      <a href="/#capabilities">产品能力</a>
      <a href="/#workflow">使用流程</a>
      <a href="/pricing">套餐价格</a>
    </nav>
    <div class="marketing-actions">
      {% if current_user %}
      <a class="btn" href="/dashboard">进入控制台</a>
      {% else %}
      <a class="btn btn-secondary" href="/login">登录</a>
      <a class="btn" href="/register">免费试用</a>
      {% endif %}
    </div>
  </header>
  {% if notice %}<div class="marketing-notice{% if notice_tone == 'danger' %} notice-danger{% endif %}" role="alert">{{ notice }}</div>{% endif %}
  <main>{% block content %}{% endblock %}</main>
  <footer class="marketing-footer">
    <strong>曜枢 AI</strong>
    <span>全渠道智能机器人运营平台</span>
    <a href="/employee/login">员工登录</a>
  </footer>
</body>
</html>
