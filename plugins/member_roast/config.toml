[plugin]
code = "member_roast"
display_name = "群成员锐评"
plugin_type = "command"
version = "2.0.0"
author = "abot"
description = "复用群成员画像和近期群聊样本，由租户自己的模型生成有边界的成员锐评。"
default_enabled = false

[capability]
# 插件只读取平台标准群消息和成员画像，回复使用通用文本结构。
channel_types = ["wechat_ipad", "wechat_winauto", "openclaw", "simulator", "telegram", "workwechat", "wechat_webridge", "wechat_gugatool"]
chat_types = ["group"]
message_types = ["text"]
priority = 115
consume_policy = "continue"
timeout_ms = 180000

[matcher]
commands = ["锐评", "锐评一下", "锐评我", "锐评一下我", "吐槽", "吐槽一下", "吐槽我", "吐槽一下我"]
require_mention = false

[secrets]
fields = ["llm_api_key"]

[runtime]

# 模型服务由租户维护和承担调用成本，平台不提供共享模型或共享密钥。
llm_api_base = ""
llm_api_key = ""
llm_model = ""
llm_timeout_seconds = 60
temperature = 0.65
max_tokens = 480

# 最近消息只用于现场语境提炼，长期信息统一复用 member_context 画像。
sample_days = 30
message_limit = 200
min_message_count = 8
representative_message_limit = 8

# 用户和群分别限流，避免单个成员刷屏或整个群集中放大模型成本。
user_rate_limit = 2
group_rate_limit = 8
rate_window_seconds = 60
max_output_chars = 320
