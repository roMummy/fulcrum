[plugin]
code = "dota2_stats"
display_name = "Dota 2 战绩"
plugin_type = "command"
version = "2.0.0"
author = "abot"
description = "通过 OpenDota 查询个人近期战绩，并为指定群聊生成每日 Dota 2 排行。"
default_enabled = false

[capability]
# 插件只输出平台标准文本或图片回复，不感知具体渠道协议和 Provider 凭证。
channel_types = ["wechat_ipad", "wechat_winauto", "openclaw", "simulator", "telegram", "workwechat", "wechat_webridge", "wechat_gugatool"]
chat_types = ["direct", "group"]
message_types = ["text"]
priority = 110
consume_policy = "continue"
timeout_ms = 180000

[matcher]
commands = ["注册Dota", "Dota战绩", "Dota群排行"]
require_mention = false

[secrets]
fields = ["api_key"]

[runtime]
api_key = ""
request_timeout_seconds = 15
retry_count = 2
user_requests_per_minute = 2
dynamic_cache_seconds = 120

# 个人战绩使用最近二十场计算概览，并在回复中展示最新十场。
summary_match_limit = 20
recent_match_limit = 10
render_as_image = true

# 群榜必须明确选择会话。准备任务联网采集，推送任务只读取当天快照。
dota2_group_ranking_conversation_ids = []
group_ranking_prepare_time = "05:00"
group_ranking_push_time = "09:00"
group_ranking_window_days = 7
group_ranking_limit = 10
minimum_win_rate_matches = 3
max_group_players = 50
snapshot_retention_days = 30
