[plugin]
code = "global_news"
display_name = "全球新闻"
plugin_type = "command"
version = "1.0.0"
author = "abot"
description = "抓取全球新闻并可选执行 Dify 摘要，迁移自 abot"
default_enabled = false

[capability]
# workwechat 复用微信系文本/群消息适配，允许企微 Hook 渠道进入插件候选。
channel_types = ["wechat_ipad", "wechat_winauto", "openclaw", "simulator", "workwechat"]
chat_types = ["direct", "group"]
message_types = ["text"]
priority = 100
consume_policy = "continue"
timeout_ms = 12000

[matcher]
commands = ["全球新闻", "国际新闻", "环球新闻", "政经新闻"]
require_mention = false

[secrets]
fields = ["authorization"]

[runtime]
sources = ["nbc", "cnn", "abc", "fox", "bbc"]
per_source_limit = 5
default_timeout = 10
dify_api_url = "http://192.168.2.240/v1/chat-messages"
authorization = "Bearer app-rhhKkbvHd2IAQoGX7xTzXZJj"
