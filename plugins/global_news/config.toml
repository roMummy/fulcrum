[plugin]
code = "global_news"
display_name = "全球新闻"
plugin_type = "command"
version = "2.0.0"
author = "abot"
description = "聚合全球新闻并生成中文政治经济简报"
default_enabled = true

[capability]
channel_types = ["wechat_ipad", "wechat_winauto", "telegram", "openclaw", "simulator", "workwechat", "wechat_webridge", "wechat_gugatool"]
chat_types = ["direct", "group"]
message_types = ["text"]
priority = 100
consume_policy = "continue"
timeout_ms = 90000

[matcher]
commands = ["全球新闻", "国际新闻", "环球新闻", "政经新闻", "政治经济新闻"]
require_mention = false

[secrets]
fields = ["llm_api_key"]

[runtime]
sources = ["nbc", "cnn", "abc", "fox", "bbc"]
per_source_limit = 5
fetch_timeout_seconds = 15
llm_api_base = ""
llm_api_key = ""
llm_model = ""
llm_timeout_seconds = 60
render_as_image = true
