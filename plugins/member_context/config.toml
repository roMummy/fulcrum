[plugin]
code = "member_context"
display_name = "群成员画像"
plugin_type = "scheduled"
version = "2.0.0"
author = "abot"
description = "基于群聊消息增量生成成员画像，并可使用租户自己的 Dify 工作流增强结构化结果。"
default_enabled = false

[capability]
# 后台任务只读取平台标准消息与群成员数据，不直接访问任何渠道 Provider。
channel_types = ["wechat_ipad", "wechat_winauto", "openclaw", "simulator", "telegram", "workwechat", "wechat_webridge", "wechat_gugatool"]
chat_types = ["group"]
message_types = ["text"]
priority = 80
consume_policy = "continue"
timeout_ms = 180000

[matcher]
# 成员画像没有聊天命令，所有刷新都由统一调度器触发。
commands = []
require_mention = false

[secrets]
fields = ["api_key"]

[runtime]

# Dify 由租户自行配置和承担成本。地址属于普通配置，API Key 进入绑定密文。
api_base = ""
api_key = ""
request_timeout_seconds = 60

# 只有租户明确选择的群会话才会生成画像。
member_context_conversation_ids = []
daily_refresh_time = "04:20"
weekly_refresh_time = "04:40"
monthly_refresh_time = "04:50"

# 首次建立画像读取有限历史样本，之后仅合并水位之后的新消息。
sample_days = 30
incremental_message_limit = 80
minimum_member_messages = 2
ai_min_member_messages = 2
max_members_per_run = 30
max_group_messages = 600
