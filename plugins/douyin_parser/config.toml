[plugin]
code = "douyin_parser"
display_name = "抖音解析"
plugin_type = "rule"
version = "2.0.0"
author = "abot"
description = "通过租户解析服务提取抖音视频或图集"
default_enabled = false

[capability]
# workwechat 复用微信系文本/群消息适配，允许企微 Hook 渠道进入插件候选。
channel_types = ["wechat_ipad", "wechat_winauto", "telegram", "openclaw", "simulator", "workwechat"]
chat_types = ["direct", "group"]
message_types = ["text", "app"]
priority = 105
consume_policy = "continue"
timeout_ms = 30000

[matcher]
keywords = ["douyin.com", "iesdouyin.com"]
require_mention = false

[secrets]
fields = ["api_key"]

[runtime]
enabled = true
api_url = ""
api_key = ""
timeout_seconds = 20
max_media_items = 5
