[plugin]
code = "douyin_parser"
display_name = "抖音解析"
plugin_type = "rule"
version = "1.0.0"
author = "abot"
description = "解析抖音分享链接并生成卡片或媒体结果，迁移自 abot"
default_enabled = false

[capability]
# workwechat 复用微信系文本/群消息适配，允许企微 Hook 渠道进入插件候选。
channel_types = ["wechat_ipad", "wechat_winauto", "telegram", "openclaw", "simulator", "workwechat"]
chat_types = ["direct", "group"]
message_types = ["text", "app"]
priority = 105
consume_policy = "continue"
timeout_ms = 12000

[matcher]
keywords = ["https://v.douyin.com/"]
require_mention = false

[runtime]
internal_api_url = "http://192.168.2.32:8999/api/hybrid/video_data"
external_api_url = "https://api.pearktrue.cn/api/video/api.php"
external_api_key = "f56c1fed0c6e64e7"
download_mode = "card"
default_timeout = 10
http_proxy = ""
