[plugin]
code = "douyin_parser"
display_name = "抖音解析"
plugin_type = "rule"
version = "3.0.0"
author = "abot"
description = "解析抖音视频与图文(含实况),优先使用 DTK 解析服务,失败回退官方接口"
default_enabled = false

[capability]
# workwechat 复用微信系文本/群消息适配，允许企微 Hook 渠道进入插件候选。
channel_types = ["wechat_ipad", "wechat_winauto", "telegram", "openclaw", "simulator", "workwechat", "wechat_webridge", "wechat_gugatool"]
chat_types = ["direct", "group"]
message_types = ["text", "app"]
priority = 105
consume_policy = "continue"
timeout_ms = 60000

[matcher]
keywords = ["douyin.com", "iesdouyin.com"]
require_mention = false

[secrets]
fields = ["dtk_api_key"]

[runtime]
# DTK 自建解析服务地址;密钥 dtk_api_key 在插件绑定的密文配置里填写,未填时只用自有解析
dtk_api_url = "https://dy.functen.com"
dtk_api_key = ""
dtk_wait_seconds = 15
# 视频发送方式: card=短视频直发/长视频卡片, file=发送视频文件
download_mode = "card"
# 一次解析加下载的整体时限(秒),必须小于 timeout_ms
timeout_seconds = 25
