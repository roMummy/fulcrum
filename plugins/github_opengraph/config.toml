[plugin]
code = "github_opengraph"
display_name = "GitHub 链接预览"
plugin_type = "rule"
version = "2.0.0"
author = "abot"
description = "自动把 GitHub 链接转换为 OpenGraph 图片预览。"
default_enabled = false

[capability]
# 插件只输出平台标准图片回复，不绑定微信、Telegram 或其他 Provider。
channel_types = ["wechat_ipad", "wechat_winauto", "openclaw", "simulator", "telegram", "workwechat", "wechat_webridge", "wechat_gugatool"]
chat_types = ["direct", "group"]
message_types = ["text"]
priority = 95
consume_policy = "continue"
timeout_ms = 30000

[matcher]
keywords = ["github.com/"]
require_mention = false

[secrets]
# 散列盐只在当前租户绑定的密文配置中保存，不进入目录默认值和执行日志。
fields = ["hash_salt"]

[runtime]
match_mode = "fuzzy"
max_links_per_message = 3
hash_salt = ""
request_timeout_seconds = 15
