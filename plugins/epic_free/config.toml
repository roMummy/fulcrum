[plugin]
code = "epic_free"
display_name = "Epic 免费游戏"
plugin_type = "scheduled"
version = "2.0.0"
author = "abot"
description = "查询 Epic 官方免费游戏，并在内容变化时向启用群聊推送。"
default_enabled = false

[capability]
# 插件只生成标准文本出站消息，不感知具体渠道协议和 Provider 凭证。
channel_types = ["wechat_ipad", "wechat_winauto", "openclaw", "simulator", "telegram", "workwechat", "wechat_webridge", "wechat_gugatool"]
chat_types = ["group"]
message_types = ["text"]
priority = 70
consume_policy = "continue"
timeout_ms = 30000

[runtime]
locale = "zh-CN"
country = "CN"
include_upcoming = true
only_on_change = true
poll_interval_seconds = 3600
timeout_seconds = 20
