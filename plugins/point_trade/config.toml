[plugin]
code = "point_trade"
display_name = "积分交易"
plugin_type = "command"
version = "1.1.0"
author = "abot"
description = "迁移自 abot 的积分交易插件，支持转账、积分查询、积分排行、打劫与保释。"
default_enabled = false

[capability]
# workwechat 复用微信系文本/群消息适配，允许企微 Hook 渠道进入插件候选。
channel_types = ["wechat_ipad", "wechat_winauto", "openclaw", "simulator", "workwechat"]
chat_types = ["group"]
message_types = ["text"]
priority = 100
consume_policy = "continue"
timeout_ms = 12000

[matcher]
commands = ["积分交易", "积分转账", "转账积分", "积分赠送", "赠送积分", "积分转移", "转移积分", "送积分", "积分送人", "送人积分", "积分赠予", "我的积分", "points_me", "积分排行", "points_rank", "打劫", "rob", "保释", "bailout", "point_trade"]
require_mention = false

[runtime]
enable = true
command = ["积分交易", "积分转账", "转账积分", "积分赠送", "赠送积分", "积分转移", "转移积分", "送积分", "积分送人", "送人积分", "积分赠予", "我的积分", "points_me", "积分排行", "points_rank", "打劫", "rob", "保释", "bailout", "point_trade"]
rob_success_rate = 0.4
rob_min_percent = 0.2
rob_max_percent = 0.4
rob_penalty_percent = 0.1
rob_cooldown = 300
rob_min_points = 30
