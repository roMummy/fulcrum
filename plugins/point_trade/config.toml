[plugin]
code = "point_trade"
display_name = "积分交易"
plugin_type = "command"
version = "2.0.0"
author = "abot"
description = "群聊积分转账、查询、排行、打劫和保释。"
default_enabled = false

[capability]
# 积分交易只依赖标准群消息、群成员、状态和积分账本，不绑定具体 provider。
channel_types = ["wechat_ipad", "wechat_winauto", "openclaw", "simulator", "telegram", "workwechat", "wechat_webridge", "wechat_gugatool"]
chat_types = ["group"]
message_types = ["text"]
priority = 100
consume_policy = "stop"
timeout_ms = 12000

[matcher]
commands = ["积分转账", "我的积分", "积分排行", "打劫", "保释"]
require_mention = false

[runtime]
ranking_limit = 10
rob_success_rate = 0.4
rob_min_percent = 0.2
rob_max_percent = 0.4
rob_penalty_percent = 0.1
rob_cooldown = 300
rob_min_points = 30
