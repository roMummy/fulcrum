[plugin]
code = "value_rank"
display_name = "群成员身价"
plugin_type = "command"
version = "2.0.0"
author = "abot"
description = "根据积分、发言、活跃和群内社交关系生成成员身价、排行、趋势与周报。"
default_enabled = false

[capability]
# 所有统计来自 SaaS 标准消息、群成员和积分账本，不访问渠道 Provider。
channel_types = ["wechat_ipad", "wechat_winauto", "openclaw", "simulator", "telegram", "workwechat", "wechat_webridge", "wechat_gugatool"]
chat_types = ["group"]
message_types = ["text"]
priority = 108
consume_policy = "continue"
timeout_ms = 180000

[matcher]
commands = ["我的身价", "身价排行", "社交热度榜", "搭子榜", "社交桥梁榜", "社交关系图", "我的趋势", "身价周报", "身价说明", "重算身价"]
require_mention = false

[runtime]

# 只有租户明确选择的群会话才参与后台快照与周报任务。
value_rank_conversation_ids = []
daily_recompute_time = "04:00"
weekly_report_prepare_time = "09:10"
weekly_report_push_time = "09:35"

message_window_days = 7
active_window_days = 30
social_window_days = 7

points_weight = 0.30
message_weight = 0.35
active_days_weight = 0.20
social_weight = 0.15
inactivity_penalty_max = 150
base_score_scale = 1000

default_rank_limit = 10
max_rank_limit = 50
default_trend_days = 7
max_trend_days = 30
snapshot_retention_days = 180
weekly_report_retention_days = 14

# 重算属于高成本管理动作，只允许租户明确配置的渠道成员账号执行。
administrator_user_ids = []
