[plugin]
code = "sehuatang_push"
display_name = "涩图 PDF 推送"
plugin_type = "scheduled"
version = "2.0.0"
author = "abot"
description = "按租户计划抓取目录并通过统一文件出站队列推送 PDF。"
default_enabled = false

[capability]
channel_types = ["wechat_ipad", "wechat_winauto", "telegram", "openclaw", "simulator", "workwechat", "wechat_webridge"]
chat_types = ["group"]
message_types = ["text"]
priority = 70
consume_policy = "continue"
timeout_ms = 120000

[matcher]
commands = []
require_mention = false

[runtime]
source_urls = ["https://www.javbus.com"]
push_time = "15:30"
target_conversation_ids = []
request_timeout_seconds = 15
max_pages = 10
max_movies = 120
max_pdf_bytes = 16777216
retention_seconds = 86400
title_prefix = "今日新片目录"
