[plugin]
code = "group_virtual"
display_name = "群虚拟"
plugin_type = "command"
version = "1.0.0"
author = "abot"
description = "Migrated scaffold from abot group_virtual"
default_enabled = false

[capability]
# workwechat 复用微信系文本/群消息适配，允许企微 Hook 渠道进入插件候选。
channel_types = ["wechat_ipad", "wechat_winauto", "workwechat"]
chat_types = ["group"]
message_types = ["text"]
priority = 100
consume_policy = "continue"
timeout_ms = 12000

[matcher]
commands = ["group_virtual"]
require_mention = false

[runtime]
enabled = true
admin_user_ids = []
prefix_template = "[群桥]{sender}@{group}: "
bridges = {}
