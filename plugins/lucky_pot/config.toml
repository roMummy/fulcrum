[plugin]
code = "lucky_pot"
display_name = "幸运池"
plugin_type = "command"
version = "1.1.0"
author = "abot"
description = "迁移自 abot 的幸运池插件，支持创建、加入、查看、开奖与取消退款。"
default_enabled = false

[capability]
# workwechat 复用微信系文本/群消息适配，允许企微 Hook 渠道进入插件候选。
channel_types = ["wechat_ipad", "wechat_winauto", "openclaw", "simulator", "workwechat"]
chat_types = ["group"]
message_types = ["text"]
priority = 100
consume_policy = "continue"
timeout_ms = 12000

[matcher]
commands = ["大奖池", "开奖池", "拼手气", "lucky_pot"]
require_mention = false

[runtime]
enable = true
command = ["大奖池", "开奖池", "拼手气", "lucky_pot"]
entry_fee = 100
max_players = 10
countdown = 120
house_cut_percent = 5
lucky_bonus_chance = 20
lucky_bonus_percent = 20
cooldown = 5
