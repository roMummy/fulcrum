[plugin]
code = "lucky_pot"
display_name = "幸运池"
plugin_type = "command"
version = "2.0.0"
author = "abot"
description = "群聊积分大奖池，支持自动开奖、守恒分配和人数不足退款"
default_enabled = false

[capability]
# 奖池只依赖平台标准群消息、积分、状态、调度和出站能力，所有渠道共用同一实现。
channel_types = ["wechat_ipad", "wechat_winauto", "telegram", "openclaw", "simulator", "workwechat", "wechat_webridge", "wechat_gugatool"]
chat_types = ["group"]
message_types = ["text"]
priority = 100
consume_policy = "stop"
timeout_ms = 30000

[matcher]
commands = ["大奖池"]
require_mention = false

[runtime]
entry_fee = 100
min_players = 2
max_players = 10
countdown_seconds = 120
house_cut_percent = 5
lucky_bonus_chance = 20
lucky_bonus_percent = 20
