[plugin]
code = "gscore_adapter"
display_name = "GScore 适配器"
plugin_type = "command"
version = "2.0.0"
author = "abot"
description = "把当前会话的游戏查询转发到租户自己的 GScore 服务。"
default_enabled = false

[capability]
# 插件只处理平台标准文本事件并输出标准文本或图片，不依赖具体渠道 Provider。
channel_types = ["wechat_ipad", "wechat_winauto", "openclaw", "simulator", "telegram", "workwechat", "wechat_webridge", "wechat_gugatool"]
chat_types = ["direct", "group"]
message_types = ["text"]
priority = 115
consume_policy = "stop"
timeout_ms = 30000

[matcher]
# 持久连接和“重连”属于旧单机运行时管理能力，SaaS 只保留业务查询命令。
commands = ["早柚"]
require_mention = false

[secrets]
# GScore 鉴权由当前租户承担，密钥只进入绑定密文配置。
fields = ["api_key"]

[runtime]
api_url = ""
api_key = ""
request_timeout_seconds = 20
max_replies = 6
