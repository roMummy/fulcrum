[plugin]
code = "dify"
display_name = "Dify 对话"
plugin_type = "ai"
version = "2.0.0"
author = "abot"
description = "AI 对话插件"
default_enabled = true

[capability]
# 文本、引用和媒体统一使用平台标准事件与回复，不绑定某一个消息协议。
channel_types = ["wechat_ipad", "wechat_winauto", "telegram", "openclaw", "simulator", "workwechat", "wechat_webridge", "wechat_gugatool"]
chat_types = ["direct", "group"]
message_types = ["text"]
priority = 120
consume_policy = "continue"
timeout_ms = 45000

[matcher]
commands = ["聊天"]
require_mention = false

[secrets]
fields = ["api_key"]

[runtime]
# Dify 应用成本由租户承担，平台不提供共享服务地址或密钥。
api_base = ""
api_key = ""
app_mode = "workflow"
request_timeout_seconds = 40
max_history_messages = 10
