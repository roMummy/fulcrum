[plugin]
code = "beautyleg"
display_name = "美腿图片"
plugin_type = "command"
version = "2.0.0"
author = "abot"
description = "从当前租户资源目录随机返回图片。"
default_enabled = false

[capability]
channel_types = ["wechat_ipad", "wechat_winauto", "telegram", "openclaw", "simulator", "workwechat", "wechat_webridge"]
chat_types = ["direct", "group"]
message_types = ["text"]
priority = 100
consume_policy = "continue"
timeout_ms = 10000

[matcher]
commands = ["美腿", "腿来", "腿照", "来张美腿图片"]
require_mention = false

[runtime]
commands = ["美腿", "腿来", "腿照", "来张美腿图片"]
resource_dir = "images"
points_cost = 2
rate_limit = 1
rate_window_seconds = 60
max_image_bytes = 16777216
