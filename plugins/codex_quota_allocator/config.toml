[plugin]
code = "codex_quota_allocator"
display_name = "Codex 额度管理"
plugin_type = "command"
version = "2.0.0"
author = "abot"
description = "查询 CPA 周额度，并通过租户自己的 Sub2API 管理订阅周限额。"
default_enabled = false

[capability]
# 插件只消费平台标准文本消息并返回标准文本回复，不依赖任何具体渠道实现。
channel_types = ["wechat_ipad", "wechat_winauto", "openclaw", "simulator", "telegram", "workwechat", "wechat_webridge", "wechat_gugatool"]
chat_types = ["direct", "group"]
message_types = ["text"]
priority = 110
consume_policy = "stop"
timeout_ms = 120000

[matcher]
# 写命令使用同一命令的第二条新消息完成确认，不增加兼容别名或管理端调试命令。
commands = ["额度查询", "额度调整", "周额重置"]
require_mention = false

[secrets]
# 两套上游服务均由当前租户承担成本，管理凭证只进入绑定密文配置。
fields = ["cpa_management_key", "sub2api_admin_api_key"]

[runtime]
admin_user_ids = []

# CPA 只支持已经验证的 v0 管理契约，地址填写服务根地址，不附加版本路径。
cpa_base_url = ""
cpa_management_key = ""
cpa_api_version = "v0"
cpa_auth_name = ""

# Sub2API 只支持已经验证的 v1 管理契约，目标必须是 OpenAI 订阅分组。
sub2api_base_url = ""
sub2api_admin_api_key = ""
sub2api_api_version = "v1"
sub2api_group_id = 0

# 额度反推参数直接影响实际限额，非法值会在外部请求前被拒绝。
minimum_used_percent = 5
safety_margin_percent = 1
currency_precision = 2
daily_sleep_hours = 8
report_timezone = "Asia/Shanghai"

# 外部读取、分页、确认和用户级限流均使用平台通用能力。
request_timeout_seconds = 20
subscription_page_size = 100
confirmation_ttl_seconds = 300
query_rate_limit = 2
query_rate_window_seconds = 600
write_rate_limit = 4
write_rate_window_seconds = 600
