[plugin]
code = "douyu"
display_name = "斗鱼"
plugin_type = "command"
version = "1.0.0"
author = "abot"
description = "斗鱼房间状态、鱼吧动态与订阅计划编排插件，迁移自 abot"
default_enabled = false

[capability]
# workwechat 复用微信系文本/群消息适配，允许企微 Hook 渠道进入插件候选。
channel_types = ["wechat_ipad", "wechat_winauto", "openclaw", "simulator", "workwechat"]
chat_types = ["group"]
message_types = ["text"]
priority = 100
consume_policy = "continue"
timeout_ms = 12000

[matcher]
commands = ["斗鱼订阅", "取消斗鱼订阅", "斗鱼订阅列表", "订阅鱼吧", "取消订阅鱼吧", "鱼吧订阅列表"]
require_mention = false

[runtime]
api_url_template = "https://www.douyu.com/betard/{room_id}"
yuba_api_url = "https://yuba.douyu.com/wgapi/yubanc/api/feed/getUserFeedList"
default_timeout = 10
default_feed_limit = 3
user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
push_all_channels = true
poll_interval_seconds = 60
