[plugin]
code = "douyu"
display_name = "斗鱼"
plugin_type = "command"
version = "2.0.0"
author = "abot"
description = "斗鱼开播、鱼吧动态和官方高能的跨渠道订阅插件"
default_enabled = false

[capability]
# workwechat 复用微信系文本/群消息适配，允许企微 Hook 渠道进入插件候选。
channel_types = ["wechat_ipad", "wechat_winauto", "telegram", "openclaw", "simulator", "workwechat", "wechat_webridge", "wechat_gugatool"]
chat_types = ["group"]
message_types = ["text"]
priority = 100
consume_policy = "continue"
timeout_ms = 12000

[matcher]
commands = ["斗鱼订阅", "取消斗鱼订阅", "斗鱼订阅列表", "斗鱼订阅提醒", "取消斗鱼订阅提醒", "开启斗鱼高能推送", "关闭斗鱼高能推送", "斗鱼高能推送状态", "订阅鱼吧", "取消订阅鱼吧", "鱼吧订阅列表"]
require_mention = false

[runtime]
api_url_template = "https://www.douyu.com/betard/{room_id}"
yuba_api_url = "https://yuba.douyu.com/wgapi/yubanc/api/feed/getUserFeedList"
highlight_api_url = "https://www.douyu.com/wgapi/vodnc/center/ailive/getHighlightDetail"
timeout_seconds = 10
feed_limit = 3
user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
admin_user_ids = []
highlight_enabled = true
highlight_interval_seconds = 600
highlight_retention_days = 14
highlight_realtime_max_items = 5
poll_interval_seconds = 300
