[plugin]
code = "daily_ranking"
display_name = "群聊每日排行"
plugin_type = "scheduled"
version = "2.0.0"
author = "abot"
description = "统计指定群聊昨日活跃用户，生成排行并发放幂等积分奖励。"
default_enabled = false

[capability]
# 日榜只生成标准文本或图片消息，具体协议发送由平台统一渠道出站能力负责。
channel_types = ["wechat_ipad", "wechat_winauto", "openclaw", "simulator", "telegram", "workwechat", "wechat_webridge", "wechat_gugatool"]
chat_types = ["group"]
message_types = ["text"]
priority = 70
consume_policy = "continue"
timeout_ms = 120000

[runtime]
# 目标群必须由租户在后台明确选择，空列表不会扫描或推送全部群聊。
daily_ranking_conversation_ids = []
prepare_time = "04:30"
push_time = "09:30"

# 图片只展示精简榜单，积分奖励人数可以更大；运行时会保证奖励人数不少于展示人数。
display_limit = 10
reward_limit = 20
render_as_image = true
