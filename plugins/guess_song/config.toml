[plugin]
code = "guess_song"
display_name = "猜歌"
plugin_type = "command"
version = "1.1.0"
author = "abot"
description = "随机选歌并发送语音片段，支持猜歌、下一首和答案揭晓"
default_enabled = false

[capability]
# workwechat 复用微信系文本/群消息适配，允许企微 Hook 渠道进入插件候选。
channel_types = ["wechat_ipad", "wechat_winauto", "openclaw", "simulator", "workwechat"]
chat_types = ["group"]
message_types = ["text"]
priority = 100
consume_policy = "continue"
timeout_ms = 20000

[matcher]
commands = ["猜歌名", "猜歌", "猜歌手"]
require_mention = false

[runtime]
music_api_url = "http://192.168.2.240:5000"
song_api_url = ""
detail_level = "exhigh"
default_timeout = 15
clip_duration = 10
hint_timeout = 30
popular_singers = ["周杰伦", "林俊杰", "薛之谦", "陈奕迅", "邓紫棋", "李荣浩", "张学友", "刘德华", "Beyond", "孙燕姿"]
