[plugin]
code = "game_task"
display_name = "游戏任务"
plugin_type = "command"
version = "1.0.0"
author = "abot"
description = "Migrated scaffold from abot game_task"
default_enabled = false

[capability]
# workwechat 复用微信系文本/群消息适配，允许企微 Hook 渠道进入插件候选。
channel_types = ["wechat_ipad", "wechat_winauto", "openclaw", "simulator", "workwechat"]
chat_types = ["group"]
message_types = ["text"]
priority = 100
consume_policy = "continue"
timeout_ms = 12000

[matcher]
commands = ["game_task"]
require_mention = false

[runtime]
enabled = true
commands = ["/s", "/t", "/a", "/r", "/l", "/h"]
score_multiplier = 1
