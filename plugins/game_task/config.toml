[plugin]
code = "game_task"
display_name = "游戏任务"
plugin_type = "command"
version = "2.0.0"
author = "abot"
description = "群聊百科问答、积分排行和随机发题"
default_enabled = false

[capability]
# 游戏逻辑只依赖平台标准群消息、状态、积分和出站能力，因此所有已支持渠道共用同一实现。
channel_types = ["wechat_ipad", "wechat_winauto", "telegram", "openclaw", "simulator", "workwechat", "wechat_webridge", "wechat_gugatool"]
chat_types = ["group"]
message_types = ["text"]
priority = 100
consume_policy = "continue"
timeout_ms = 12000

[matcher]
# 平台目录统一处理斜杠和井号前缀，插件清单只声明命令名称。
commands = ["s", "t", "a", "r", "l", "h"]
require_mention = false

[runtime]
score_multiplier = 1
ranking_limit = 10
max_active_tasks = 10
# 随机发题默认关闭，租户必须明确选择群会话和执行时间，避免启用插件后自动打扰群聊。
random_task_enabled = false
random_task_time = "17:58"
random_task_conversation_ids = []
