[plugin]
code = "message_push_task"
display_name = "定时推送"
plugin_type = "scheduled"
version = "2.0.0"
author = "abot"
description = "在当前群聊中创建、查看和取消文本定时推送。"
default_enabled = false

[capability]
# 插件只依赖标准群文本和通用出站队列，不绑定任何具体 provider 实现。
channel_types = ["wechat_ipad", "wechat_winauto", "openclaw", "simulator", "telegram", "workwechat", "wechat_webridge", "wechat_gugatool"]
chat_types = ["group"]
message_types = ["text"]
priority = 150
consume_policy = "continue"
timeout_ms = 12000

[matcher]
commands = ["定时推送"]
require_mention = false

[runtime]
enable = true
command = ["定时推送"]
