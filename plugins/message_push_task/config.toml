[plugin]
code = "message_push_task"
display_name = "消息推送任务"
plugin_type = "scheduled"
version = "1.0.0"
author = "abot"
description = "迁移自 abot 的消息推送任务插件，复用当前 task_jobs/outbound_dispatch 队列创建定时消息。"
default_enabled = false

[capability]
# workwechat 复用微信系文本/群消息适配，允许企微 Hook 渠道进入插件候选。
channel_types = ["wechat_ipad", "wechat_winauto", "openclaw", "simulator", "workwechat"]
chat_types = ["group"]
message_types = ["text"]
priority = 150
consume_policy = "continue"
timeout_ms = 12000

[matcher]
commands = ["推送", "消息推送", "定时推送", "message_push_task"]
require_mention = false

[runtime]
enable = true
command = ["推送", "消息推送", "定时推送", "message_push_task"]
