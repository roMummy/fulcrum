[plugin]
code = "music"
display_name = "音乐点播"
plugin_type = "command"
version = "2.0.0"
author = "abot"
description = "搜索歌曲并返回跨渠道可播放文件"
default_enabled = false

[capability]
channel_types = ["wechat_ipad", "wechat_winauto", "telegram", "openclaw", "simulator", "workwechat", "wechat_webridge", "wechat_gugatool"]
chat_types = ["direct", "group"]
message_types = ["text"]
priority = 100
consume_policy = "continue"
timeout_ms = 30000

[matcher]
commands = ["点歌", "音乐", "音乐点播", "点播音乐", "音乐点歌"]
require_mention = false

[secrets]
fields = ["api_key"]

[runtime]
api_base = ""
api_key = ""
quality = "exhigh"
timeout_seconds = 15
