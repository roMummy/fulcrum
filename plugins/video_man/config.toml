[plugin]
code = "video_man"
display_name = "猛男视频"
plugin_type = "command"
version = "2.0.0"
author = "abot"
description = "从租户配置的视频目录服务获取受限视频并跨渠道回复。"
default_enabled = false

[capability]
channel_types = ["wechat_ipad", "wechat_winauto", "telegram", "openclaw", "simulator", "workwechat", "wechat_webridge"]
chat_types = ["direct", "group"]
message_types = ["text"]
priority = 100
consume_policy = "continue"
timeout_ms = 30000

[matcher]
commands = ["猛男", "肌肉", "帅哥"]
require_mention = false

[runtime]
enabled = false
commands = ["猛男", "肌肉", "帅哥"]
api_url = "https://api.52vmy.cn/api/video/boy?type=json"
request_timeout_seconds = 20
points_cost = 2
rate_limit = 3
rate_window_seconds = 60
max_video_bytes = 41943040
max_video_seconds = 180

