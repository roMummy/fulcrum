[plugin]
code = "message_summary"
display_name = "群聊消息总结"
plugin_type = "command"
version = "2.0.0"
author = "abot"
description = "按日期汇总群聊重点、结论和待办"
default_enabled = true

[capability]
channel_types = ["wechat_ipad", "wechat_winauto", "telegram", "openclaw", "simulator", "workwechat", "wechat_webridge", "wechat_gugatool"]
chat_types = ["group"]
message_types = ["text"]
priority = 110
consume_policy = "continue"
timeout_ms = 180000

[matcher]
commands = ["总结", "summary"]
require_mention = false

[secrets]
fields = ["api_key"]

[runtime]
api_base = ""
api_key = ""
min_messages = 100
max_messages = 1000
request_timeout_seconds = 60
render_as_image = true
daily_summary_conversation_ids = []
daily_summary_prepare_time = "03:00"
daily_summary_push_time = "09:00"
