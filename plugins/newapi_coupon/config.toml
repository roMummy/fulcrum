[plugin]
code = "newapi_coupon"
display_name = "NewAPI 领券"
plugin_type = "command"
version = "2.0.0"
author = "abot"
description = "为真实群成员绑定租户自己的 NewAPI 订阅套餐。"
default_enabled = false

[capability]
# 群成员、消息和回复均使用平台通用模型，不依赖微信或其他具体渠道客户端。
channel_types = ["wechat_ipad", "wechat_winauto", "openclaw", "simulator", "telegram", "workwechat", "wechat_webridge", "wechat_gugatool"]
chat_types = ["group"]
message_types = ["text"]
priority = 110
consume_policy = "stop"
timeout_ms = 120000

[matcher]
# 旧命令别名已删除，当前产品只保留一个明确入口。
commands = ["领券"]
require_mention = false

[secrets]
# NewAPI 管理令牌和邮件密码由当前租户维护，不使用平台共享凭证。
fields = ["admin_access_token", "smtp_password"]

[runtime]
base_url = ""
admin_access_token = ""
admin_user_id = 0
subscription_plan_id = 0
auto_create_user = false
username_prefix = "mbs"
request_timeout_seconds = 20
claim_rate_limit = 3
claim_rate_window_seconds = 3600

# 已有账号可在群内返回脱敏结果；自动开户必须使用 email，初始密码绝不回群。
notify_mode = "group"
smtp_host = ""
smtp_port = 465
smtp_username = ""
smtp_password = ""
smtp_from_email = ""
smtp_use_ssl = true
email_subject = "NewAPI 套餐已开通"
