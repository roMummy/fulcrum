[plugin]
code = "message_sign"
display_name = "群签到"
plugin_type = "command"
version = "2.0.0"
author = "abot"
description = "群聊签到、连续签到奖励、当日排名和昨天补签。"
default_enabled = false

[capability]
# 签到只依赖平台标准群消息和积分账本，所有渠道共用同一业务实现。
channel_types = ["wechat_ipad", "wechat_winauto", "openclaw", "simulator", "telegram", "workwechat", "wechat_webridge", "wechat_gugatool"]
chat_types = ["group"]
message_types = ["text"]
priority = 100
consume_policy = "stop"
timeout_ms = 12000

[ai]
# AI 调度声明：低风险，可由 AI 把“我要签到”改写成 /签到。
routable = true
risk = "low"
summary = "群成员每日签到领取积分"
examples = ["我要签到", "今天打卡", "签个到"]
needs_args = ""

[matcher]
commands = ["签到", "补签"]
require_mention = false

[runtime]
min_point = 3
max_point = 50
streak_cycle = 1
max_streak_point = 50
makeup_cost = 10
