[plugin]
code = "xiuren_image"
display_name = "秀人图片"
plugin_type = "command"
version = "3.1.0"
author = "abot"
description = "从图片目录随机预取一批图片,收到命令后发送一张,用完再取下一批"
default_enabled = false

[capability]
channel_types = ["wechat_ipad", "wechat_winauto", "telegram", "openclaw", "simulator", "workwechat", "wechat_webridge"]
chat_types = ["direct", "group"]
message_types = ["text"]
priority = 100
consume_policy = "continue"
timeout_ms = 30000

[matcher]
commands = ["图来", "秀人", "美图", "随机图片"]
require_mention = false

[runtime]
commands = ["图来", "秀人", "美图", "随机图片"]
# 图片目录:平台图片库根目录(环境变量 MEDIA_LIBRARY_ROOT)下的子目录,不能写绝对路径。
# 平台没有配置图片库根目录时,使用本租户自己的插件目录。
library_dir = "xiuren"
# 每次从目录里随机预取的张数(只记路径,发图时再读取文件)
prefetch_count = 20
points_cost = 5
rate_limit = 5
rate_window_seconds = 60
max_image_bytes = 8388608
