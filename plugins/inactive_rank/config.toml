[plugin]
code = "inactive_rank"
display_name = "潜水排行"
plugin_type = "command"
version = "2.0.0"
author = "abot"
description = "基于当前群成员活跃时间生成潜水排行"
default_enabled = false

[capability]
# workwechat 复用微信系文本/群消息适配，允许企微 Hook 渠道进入插件候选。
channel_types = ["wechat_ipad", "wechat_winauto", "telegram", "openclaw", "simulator", "workwechat", "wechat_webridge"]
chat_types = ["group"]
message_types = ["text"]
priority = 100
consume_policy = "continue"
timeout_ms = 12000

[matcher]
commands = ["潜水排行"]
require_mention = false

[runtime]
default_days = 60
default_limit = 10
max_days = 365
max_limit = 50
