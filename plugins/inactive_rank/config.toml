[plugin]
code = "inactive_rank"
display_name = "潜水排行"
plugin_type = "command"
version = "1.0.0"
author = "abot"
description = "迁移自 abot 的潜水排行插件，基于现有消息和群成员数据统计静默成员。"
default_enabled = false

[capability]
# workwechat 复用微信系文本/群消息适配，允许企微 Hook 渠道进入插件候选。
channel_types = ["wechat_ipad", "wechat_winauto", "openclaw", "simulator", "workwechat"]
chat_types = ["group"]
message_types = ["text"]
priority = 100
consume_policy = "continue"
timeout_ms = 12000

[matcher]
commands = ["潜水排行", "inactive_rank", "silent_rank"]
require_mention = false

[runtime]
enable = true
command = ["潜水排行", "inactive_rank", "silent_rank"]
default_days = 60
default_limit = 10
