[plugin]
code = "weather"
display_name = "天气"
plugin_type = "rule"
version = "2.0.0"
author = "abot"
description = "天气查询与每日订阅推送"
default_enabled = false

[capability]
channel_types = ["wechat_ipad", "wechat_winauto", "telegram", "openclaw", "simulator", "workwechat"]
chat_types = ["direct", "group"]
message_types = ["text"]
priority = 90
consume_policy = "continue"
timeout_ms = 30000

[matcher]
commands = ["天气", "订阅天气", "取消订阅"]
keywords = ["天气"]
require_mention = false

[secrets]
fields = ["api_key"]

[runtime]
enabled = true
api_base = ""
api_key = ""
default_city = "北京"
timeout_seconds = 15
daily_push_time = "08:00"
