[plugin]
code = "daily_news"
display_name = "每日新闻"
plugin_type = "scheduled"
version = "1.0.0"
author = "abot"
description = "每天向已启用群聊推送百度热榜和 60 秒新闻图片"
default_enabled = false

[capability]
# workwechat 复用微信系文本/群消息适配，允许企微 Hook 渠道进入插件候选。
channel_types = ["wechat_ipad", "wechat_winauto", "telegram", "openclaw", "simulator", "workwechat", "wechat_webridge", "wechat_gugatool"]
chat_types = ["group"]
message_types = ["text"]
priority = 100
consume_policy = "continue"
timeout_ms = 20000

[runtime]
baidu_api_url = "https://top.baidu.com/api/board?platform=wise&tab=realtime"
news60s_api_url = ""
default_timeout = 15
baidu_limit = 30
push_time = "08:30"
