[plugin]
code = "daily_news"
display_name = "每日新闻"
plugin_type = "command"
version = "1.0.0"
author = "abot"
description = "每日新闻插件，支持手动查询与每日 08:30 自动推送"
default_enabled = false

[capability]
# workwechat 复用微信系文本/群消息适配，允许企微 Hook 渠道进入插件候选。
channel_types = ["wechat_ipad", "wechat_winauto", "telegram", "openclaw", "simulator", "workwechat"]
chat_types = ["group", "direct"]
message_types = ["text"]
priority = 100
consume_policy = "continue"
timeout_ms = 20000

[matcher]
commands = ["今日新闻", "百度新闻", "隔夜要闻", "60s新闻"]
require_mention = false

[runtime]
baidu_api_url = "https://top.baidu.com/api/board?platform=wise&tab=realtime"
important_news_api_url = "https://www.cls.cn/api/sw?app=CailianpressWeb&os=web&sv=7.7.5"
news60s_api_url = "http://192.168.2.32:4399/v2/60s"
default_timeout = 15
baidu_limit = 15
push_time = "08:30"
push_all_channels = true
