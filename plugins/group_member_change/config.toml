[plugin]
code = "group_member_change"
display_name = "群成员变更"
plugin_type = "observer"
version = "1.0.0"
author = "abot"
description = "迁移自 abot 的群成员变更插件，识别入群系统消息并自动生成欢迎提示。"
default_enabled = false

[capability]
# workwechat 复用微信系文本/群消息适配，允许企微 Hook 渠道进入插件候选。
channel_types = ["wechat_ipad", "wechat_winauto", "simulator", "workwechat"]
chat_types = ["group"]
message_types = ["system", "text"]
priority = 60
consume_policy = "continue"
timeout_ms = 12000

[matcher]
commands = []
require_mention = false
