[plugin]
code = "group_member_change"
display_name = "群成员变更"
plugin_type = "observer"
version = "2.0.0"
author = "abot"
description = "同步当前群成员加入与离开状态，并发送入群欢迎语"
default_enabled = false

[capability]
# workwechat 复用微信系文本/群消息适配，允许企微 Hook 渠道进入插件候选。
channel_types = ["wechat_ipad", "wechat_winauto", "telegram", "simulator", "workwechat", "wechat_webridge"]
chat_types = ["group"]
message_types = ["event", "system", "text", "group_member_join", "group_member_leave", "group_member_nickname_change"]
priority = 60
consume_policy = "continue"
timeout_ms = 12000

[matcher]
commands = []
require_mention = false
